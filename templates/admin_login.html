<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PlantAI | Admin</title>
<style>

:root{
    --bg:#070A09;
    --panel:rgba(255,255,255,.065);
    --border:rgba(255,255,255,.15);
    --emerald:#00FF87;
    --cyan:#00F0FF;
    --lime:#CCFF00;
    --purple:#A855F7;
    --white:#F5FFF9;
    --muted:#9BA9A1;
    --danger:#FF3B5C;
}

*{ margin:0; padding:0; box-sizing:border-box; }

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    font-family:Arial, Helvetica, sans-serif;
    color:var(--white);
    background:var(--bg);
    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    width:450px;
    height:450px;
    left:-180px;
    top:-150px;
    background:var(--purple);
    opacity:.10;
    filter:blur(100px);
    border-radius:50%;
    pointer-events:none;
}

body::after{
    content:"";
    position:fixed;
    width:400px;
    height:400px;
    right:-150px;
    bottom:-100px;
    background:var(--emerald);
    opacity:.10;
    filter:blur(100px);
    border-radius:50%;
    pointer-events:none;
}

.auth-container{ width:100%; max-width:430px; position:relative; z-index:2; }

.logo{ text-align:center; margin-bottom:22px; }

.logo-icon{
    width:65px;
    height:65px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:auto;
    border-radius:20px;
    background:linear-gradient(135deg, var(--purple), var(--cyan));
    color:#00130B;
    font-size:34px;
    box-shadow:0 0 35px rgba(168,85,247,.35);
}

.logo h1{ margin-top:12px; font-size:28px; }
.logo h1 span{ color:var(--purple); }
.logo p{ color:var(--muted); font-size:12px; margin-top:7px; }

.card{
    padding:30px;
    border-radius:24px;
    background:linear-gradient(135deg, rgba(255,255,255,.09), rgba(255,255,255,.025));
    border:1px solid var(--border);
    backdrop-filter:blur(20px);
    box-shadow:0 25px 80px rgba(0,0,0,.45);
}

.badge{
    display:inline-flex;
    align-items:center;
    gap:7px;
    padding:7px 11px;
    border-radius:50px;
    color:var(--purple);
    background:rgba(168,85,247,.10);
    border:1px solid rgba(168,85,247,.28);
    font-size:10px;
    font-weight:bold;
    letter-spacing:1px;
}

h2{ margin-top:15px; font-size:25px; }
.subtitle{ color:var(--muted); font-size:12px; line-height:1.5; margin-top:7px; }

.message{ margin-top:18px; padding:13px 15px; border-radius:13px; font-size:12px; line-height:1.5; }

.error{
    color:#FF8095;
    background:rgba(255,59,92,.10);
    border:1px solid rgba(255,59,92,.30);
}

.form-group{ margin-top:18px; }

label{
    display:block;
    color:var(--muted);
    font-size:11px;
    font-weight:bold;
    letter-spacing:.7px;
    margin-bottom:8px;
}

input{
    width:100%;
    padding:14px 15px;
    border-radius:13px;
    border:1px solid rgba(255,255,255,.13);
    background:rgba(255,255,255,.055);
    color:white;
    outline:none;
    font-size:14px;
    transition:.2s;
}

input:focus{
    border-color:rgba(168,85,247,.55);
    box-shadow:0 0 0 3px rgba(168,85,247,.08);
}

input::placeholder{ color:#68756E; }

.btn{
    width:100%;
    border:none;
    padding:14px;
    margin-top:22px;
    border-radius:13px;
    font-weight:bold;
    cursor:pointer;
    color:#00130B;
    background:linear-gradient(100deg, var(--purple), var(--cyan));
    box-shadow:0 0 30px rgba(168,85,247,.18);
    transition:.25s;
}

.btn:hover{ transform:translateY(-2px); }

.switch{ text-align:center; color:var(--muted); font-size:12px; margin-top:20px; }
.switch a{ color:var(--purple); text-decoration:none; font-weight:bold; }
.switch a:hover{ text-decoration:underline; }

.footer{ text-align:center; color:#5F6C65; font-size:10px; margin-top:20px; }

@media(max-width:500px){
    body{ padding:14px; }
    .card{ padding:23px; }
    .logo h1{ font-size:25px; }
}

</style>
</head>
<body>

<div class="auth-container">

    <div class="logo">
        <div class="logo-icon">🛡️</div>
        <h1>Plant<span>AI</span></h1>
        <p>Admin Control Panel</p>
    </div>

    <div class="card">

        <div class="badge">🔒 ADMIN ACCESS</div>
        <h2>Admin Sign In</h2>
        <p class="subtitle">Restricted area. Authorized administrators only.</p>

        {% if error %}
        <div class="message error">⚠ {{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('admin_login') }}">

            <div class="form-group">
                <label>USERNAME</label>
                <input
                    type="text"
                    name="username"
                    placeholder="Admin username"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="form-group">
                <label>PASSWORD</label>
                <input
                    type="password"
                    name="password"
                    placeholder="Admin password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button type="submit" class="btn">🛡️ Enter Dashboard</button>

        </form>

        <div class="switch">
            Not an admin? <a href="{{ url_for('login') }}">Go to user login</a>
        </div>

    </div>

    <div class="footer">🌱 PlantAI · Admin Control Panel</div>

</div>

</body>
</html>
