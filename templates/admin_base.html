<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PlantAI | Admin {% block title %}{% endblock %}</title>
<style>

:root{
    --bg:#070A09;
    --panel:rgba(255,255,255,.065);
    --border:rgba(255,255,255,.15);
    --emerald:#00FF87;
    --cyan:#00F0FF;
    --lime:#CCFF00;
    --purple:#A855F7;
    --white:#F5FFF9;
    --muted:#9BA9A1;
    --danger:#FF3B5C;
    --sidebar-w:230px;
}

*{ margin:0; padding:0; box-sizing:border-box; }

body{
    min-height:100vh;
    font-family:Arial, Helvetica, sans-serif;
    color:var(--white);
    background:var(--bg);
    display:flex;
}

/* ---------- SIDEBAR ---------- */

.sidebar{
    width:var(--sidebar-w);
    min-height:100vh;
    background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.015));
    border-right:1px solid var(--border);
    padding:24px 16px;
    display:flex;
    flex-direction:column;
    position:sticky;
    top:0;
    align-self:flex-start;
}

.sidebar .brand{
    display:flex;
    align-items:center;
    gap:10px;
    padding:0 8px 22px;
    border-bottom:1px solid var(--border);
    margin-bottom:18px;
}

.sidebar .brand-icon{
    width:38px;
    height:38px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:11px;
    background:linear-gradient(135deg, var(--purple), var(--cyan));
    font-size:18px;
}

.sidebar .brand h1{ font-size:16px; }
.sidebar .brand h1 span{ color:var(--purple); }
.sidebar .brand p{ color:var(--muted); font-size:10px; margin-top:2px; }

.nav-item{
    display:flex;
    align-items:center;
    gap:11px;
    padding:12px 14px;
    border-radius:12px;
    color:var(--muted);
    text-decoration:none;
    font-size:13px;
    font-weight:bold;
    margin-bottom:5px;
    transition:.15s;
    border:1px solid transparent;
}

.nav-item .ic{ font-size:15px; width:18px; text-align:center; }

.nav-item:hover{
    color:var(--white);
    background:rgba(255,255,255,.05);
}

.nav-item.active{
    color:var(--white);
    background:linear-gradient(100deg, rgba(168,85,247,.18), rgba(0,240,255,.10));
    border-color:rgba(168,85,247,.35);
}

.nav-spacer{ flex:1; }

.nav-item.logout{ color:#FF8095; }
.nav-item.logout:hover{ background:rgba(255,59,92,.10); }

.sidebar-footer{
    padding:12px 8px 0;
    border-top:1px solid var(--border);
    margin-top:10px;
    color:var(--muted);
    font-size:10px;
}

/* ---------- MAIN ---------- */

.main{
    flex:1;
    min-width:0;
    padding:30px 34px 60px;
}

.page-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:12px;
    margin-bottom:26px;
}

.page-header h2{ font-size:22px; }
.page-header p{ color:var(--muted); font-size:12px; margin-top:4px; }

.user-chip{
    color:var(--muted);
    font-size:12px;
    padding:8px 14px;
    border-radius:10px;
    border:1px solid var(--border);
    background:rgba(255,255,255,.04);
}

/* ---------- SHARED WIDGETS ---------- */

.stats{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(190px, 1fr));
    gap:16px;
    margin-bottom:30px;
}

.stat-card{
    padding:20px;
    border-radius:18px;
    background:linear-gradient(135deg, rgba(255,255,255,.09), rgba(255,255,255,.025));
    border:1px solid var(--border);
}

.stat-card .num{ font-size:28px; font-weight:bold; color:var(--emerald); }
.stat-card.purple .num{ color:var(--purple); }
.stat-card.cyan .num{ color:var(--cyan); }
.stat-card.danger .num{ color:var(--danger); }
.stat-card .label{ color:var(--muted); font-size:11px; letter-spacing:.5px; margin-top:6px; }

.section{
    padding:22px;
    border-radius:20px;
    background:linear-gradient(135deg, rgba(255,255,255,.07), rgba(255,255,255,.02));
    border:1px solid var(--border);
    margin-bottom:24px;
    overflow-x:auto;
}

.section h3{ font-size:15px; margin-bottom:16px; }
.section h3 span{ color:var(--muted); font-weight:normal; font-size:12px; }

table{ width:100%; border-collapse:collapse; font-size:13px; min-width:560px; }

th{
    text-align:left;
    color:var(--muted);
    font-size:10px;
    letter-spacing:.6px;
    padding:10px 12px;
    border-bottom:1px solid var(--border);
}

td{
    padding:12px;
    border-bottom:1px solid rgba(255,255,255,.06);
    color:var(--white);
}

tr:hover td{ background:rgba(255,255,255,.03); }

.pill{
    display:inline-block;
    padding:3px 10px;
    border-radius:50px;
    font-size:10px;
    font-weight:bold;
}

.pill-admin{ background:rgba(168,85,247,.15); color:var(--purple); border:1px solid rgba(168,85,247,.3); }
.pill-user{ background:rgba(0,255,135,.10); color:var(--emerald); border:1px solid rgba(0,255,135,.25); }
.pill-healthy{ background:rgba(0,255,135,.10); color:var(--emerald); border:1px solid rgba(0,255,135,.25); }
.pill-disease{ background:rgba(255,59,92,.10); color:#FF8095; border:1px solid rgba(255,59,92,.3); }

.empty{ color:var(--muted); font-size:12px; padding:14px 0; }

.search-form{ display:flex; gap:10px; margin-bottom:18px; max-width:360px; }

.search-form input{
    flex:1;
    padding:11px 14px;
    border-radius:12px;
    border:1px solid var(--border);
    background:rgba(255,255,255,.05);
    color:var(--white);
    outline:none;
    font-size:13px;
}

.search-form input:focus{ border-color:rgba(168,85,247,.5); }

.btn-small{
    border:none;
    padding:11px 16px;
    border-radius:12px;
    font-weight:bold;
    font-size:12px;
    cursor:pointer;
    color:#00130B;
    background:linear-gradient(100deg, var(--purple), var(--cyan));
}

.btn-danger{
    border:none;
    padding:7px 13px;
    border-radius:9px;
    font-weight:bold;
    font-size:11px;
    cursor:pointer;
    color:#fff;
    background:rgba(255,59,92,.15);
    border:1px solid rgba(255,59,92,.4);
    transition:.15s;
}

.btn-danger:hover{ background:var(--danger); color:#fff; }

@media(max-width:820px){
    body{ flex-direction:column; }
    .sidebar{ width:100%; min-height:auto; position:relative; flex-direction:row; overflow-x:auto; align-items:center; }
    .sidebar .brand{ border-bottom:none; border-right:1px solid var(--border); padding:0 16px 0 0; margin:0 12px 0 0; }
    .nav-spacer{ display:none; }
    .main{ padding:22px 16px 50px; }
}

</style>
</head>
<body>

<div class="sidebar">

    <div class="brand">
        <div class="brand-icon">🛡️</div>
        <div>
            <h1>Plant<span>AI</span></h1>
            <p>Admin Panel</p>
        </div>
    </div>

    <a href="{{ url_for('admin_dashboard') }}" class="nav-item {% if active_page == 'dashboard' %}active{% endif %}">
        <span class="ic">📊</span> Dashboard
    </a>

    <a href="{{ url_for('admin_users') }}" class="nav-item {% if active_page == 'users' %}active{% endif %}">
        <span class="ic">👥</span> Users
    </a>

    <a href="{{ url_for('admin_predictions') }}" class="nav-item {% if active_page == 'predictions' %}active{% endif %}">
        <span class="ic">🌿</span> Predictions
    </a>

    <a href="{{ url_for('admin_activity') }}" class="nav-item {% if active_page == 'activity' %}active{% endif %}">
        <span class="ic">🕒</span> Activity
    </a>

    <a href="{{ url_for('admin_settings') }}" class="nav-item {% if active_page == 'settings' %}active{% endif %}">
        <span class="ic">⚙️</span> Settings
    </a>

    <div class="nav-spacer"></div>

    <a href="{{ url_for('admin_logout') }}" class="nav-item logout">
        <span class="ic">🚪</span> Logout
    </a>

    <div class="sidebar-footer">Signed in as {{ username }}</div>

</div>

<div class="main">
    {% block content %}{% endblock %}
</div>

</body>
</html>
